services:
  - type: web
    name: ristoaudit
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: RISTOAUDIT_USER
        value: admin
      - key: RISTOAUDIT_PASSWORD
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: TRIPADVISOR_TERRA_API_KEY
        sync: false
      - key: BRIGHTDATA_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: jericho1965-droid/RistoAudit
      - key: GITHUB_DATA_BRANCH
        value: data-sync
