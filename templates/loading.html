<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analisi in corso — {{ restaurant_name }}</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
      padding: 20px;
    }
    .box {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 36px 32px;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    .logo-wrap {
      background: #fff;
      border-radius: 12px;
      padding: 8px 14px;
      display: inline-block;
      margin-bottom: 18px;
    }
    .logo-wrap img { height: 76px; width: auto; display: block; }
    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid rgba(255,255,255,0.2);
      border-top-color: #fb923c;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 12px auto 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { margin: 0 0 8px; font-size: 1.4rem; }
    p { margin: 6px 0; color: #cbd5e1; font-size: 0.93rem; }
    .timer { margin-top: 14px; font-size: 0.84rem; color: #fdba74; font-weight: 600; }
    .err { display: none; margin-top: 16px; background: #fef2f2; color: #991b1b; padding: 12px; border-radius: 8px; font-size: 0.88rem; }
    a.back { display: inline-block; margin-top: 14px; color: #fdba74; text-decoration: none; font-weight: 600; font-size: 0.88rem; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo-wrap"><img src="/assets/ristoaudit-logo.png" alt="RistoAudit"></div>
    <div class="spinner" id="sp"></div>
    <h1>Analisi completa in corso...</h1>
    <p><strong>{{ restaurant_name }}</strong> ({{ city }})</p>
    <p>Stiamo analizzando sito web, menù digitale, scheda Google Maps, recensioni Google (con controllo risposte), TripAdvisor e Facebook.</p>
    <div class="timer" id="timer">Tempo trascorso: 0s (attesa tipica 40–110 secondi)</div>
    <div class="err" id="err-box"></div>
    <a class="back" href="/">← Torna alla Home</a>
  </div>

  <script>
    const jobId = "{{ job_id }}";
    let secs = 0;
    setInterval(() => {
      secs += 1;
      document.getElementById("timer").textContent = "Tempo trascorso: " + secs + "s (attesa tipica 40–110 secondi)";
    }, 1000);

    async function poll() {
      try {
        const res = await fetch("/status/" + jobId, { cache: "no-store" });
        if (!res.ok) return;
        const data = await res.json();
        if (data.status === "done") {
          window.location.href = "/result/" + jobId;
          return;
        }
        if (data.status === "error") {
          document.getElementById("sp").style.display = "none";
          const eb = document.getElementById("err-box");
          eb.style.display = "block";
          eb.textContent = "Errore durante l'analisi: " + (data.error || "errore sconosciuto");
          return;
        }
      } catch (e) {}
      setTimeout(poll, 3000);
    }
    setTimeout(poll, 2500);
  </script>
</body>
</html>
